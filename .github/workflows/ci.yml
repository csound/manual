name: ci
on:
  push:
    branches:
      - develop
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - run: pip install mkdocs-material
      - run: mkdocs build

      - name: Zip manual
        run: |
          cd site
          zip -r ../csound_manual-html.zip .

      - name: Upload artifacts
        uses: actions/upload-artifacts@v4
        with:
            name: csound_manual-html
            path: csound_manual-html.zip
